version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: default
    stream: ext://sys.stdout

  access_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: default
    filename: /var/log/app/access.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf-8

  app_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: default
    filename: /var/log/app/app.log
    when: midnight
    interval: 1
    backupCount: 7
    encoding: utf-8

loggers:
  # HTTP access log
  uvicorn.access:
    level: INFO
    handlers: [console, access_file]
    propagate: false

  # Lỗi uvicorn nội bộ
  uvicorn.error:
    level: INFO
    handlers: [console, app_file]
    propagate: false

  # Logger riêng cho app của bạn
  app:
    level: INFO
    handlers: [console, app_file]
    propagate: false

root:
  level: INFO
  handlers: [console, app_file]