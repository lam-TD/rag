[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.117.1",
    "google-genai>=1.52.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.30",
    "langchain-text-splitters>=0.3.11",
    "pgvector[psycopg]>=0.4.1",
    "psycopg2-binary>=2.9.10",
    "psycopg[async,binary]>=3.2.13",
    "sqlalchemy[asyncio]>=2.0.43",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",  # FastAPI dùng Depends(...) trong default param
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"