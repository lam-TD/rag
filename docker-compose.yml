services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
     - backend
    # restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    container_name: rag_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
     - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USERNAME  -d $DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

networks:
  backend:
    driver: bridge