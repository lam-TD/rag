services:
  db:
    image: postgres:15
    container_name: rag_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - ./db/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: rag_api
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./services/api/app:/api/app
      - ./uploads:/uploads
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    restart: unless-stopped
