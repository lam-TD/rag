services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db2
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - ./db/pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  api:
    build: ./apps/api
    container_name: rag_api
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rag_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./apps/api/app:/api/app
      - ./uploads:/uploads
    ports:
      - "${API_HOST_PORT:-8001}:8000"
    restart: unless-stopped

volumes:
  pgdata: