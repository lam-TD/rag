[project]
name = "rag-cli"
version = "0.1.0"
description = "Command-line tools for interacting with the RAG platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.2,<0.29",
    "typer>=0.12.5",
    "rich>=13.9.4",
    "pydantic>=2.8.2",
]

[project.scripts]
rag = "rag_cli.main:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "respx>=0.21.1",
    "typer-cli>=0.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_cli"]
